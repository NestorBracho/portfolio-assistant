repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0  # same as blogweb; keep in sync with the dev requirements once there are any
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks  # scans the staged changes for secrets
