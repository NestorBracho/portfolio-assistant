name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Jobs only read the repository
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pre-commit==4.7.0

      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      # gitleaks has a job of its own below: its pre-commit hook only looks at staged changes
      - name: ruff, through the pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: gitleaks

  secrets:
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1  # same as .pre-commit-config.yaml
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the whole history, not just the last commit

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archive"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" | grep " $archive\$" | sha256sum --check
          tar -xzf "$archive" gitleaks

      # Every commit in the repository, with the exceptions in .gitleaks.toml
      - name: No secrets in the history
        run: ./gitleaks git --no-banner --redact --verbose .
